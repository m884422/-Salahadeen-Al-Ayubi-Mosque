name: Update prayer calendar
on:
  schedule:
    - cron: "15 2 * * *"      # every day ~02:15 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_feed.py
      - run: |
          git config user.name "prayer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || (git commit -m "Update prayer times $(date -u +%F)" && git push)
